name: Skill Forge acceptance

on:
  push:
    branches: [ci/verify-skill-forge-20261123]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill, adversarial checks, scaffold and MCP smoke test
        run: make test
